name: Build G-A-E APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque sur le serveur
        run: |
          echo "==> Espace disque avant nettoyage :"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "==> Espace disque après nettoyage :"
          df -h /

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configuration de Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: Dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libwebp-dev \
            libgtk-3-dev \
            ninja-build \
            libncurses5 \
            libtinfo5 \
            libffi-dev

      - name: Acceptation des licences Android SDK
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Intégration de Flet 0.21.2, FPDF2, ReportLab et Simulation PIL
        run: |
          python -m pip install --upgrade "pip<24" "setuptools<70" wheel

          # 1. Écriture du requirements.txt pour Flet 0.21.2
          echo "flet==0.21.2" > requirements.txt
          echo "requests" >> requirements.txt
          echo "pypdf" >> requirements.txt
          pip install -r requirements.txt
          pip install . || true

          # 2. Téléchargement direct de fpdf2 et reportlab en Python pur
          pip install fpdf2 --target . --no-deps
          pip install reportlab --target . --no-deps

          # 3. Simulation du module PIL virtuel
          mkdir -p PIL
          cat << 'EOF' > PIL/__init__.py
          from . import Image
          EOF
          
          cat << 'EOF' > PIL/Image.py
          class Image:
              @staticmethod
              def open(fp, mode='r'):
                  return Image()
              def resize(self, size, *args, **kwargs):
                  return self
              def convert(self, *args, **kwargs):
                  return self
          EOF

      - name: Compilation de l'APK Flet
        env:
          CI: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          PUB_DISABLE_ANALYTICS: "true"
          PIP_VERBOSE: "1"
        run: |
          flet build apk --verbose

      - name: Publier l'APK sur GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find build/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Publication de l'APK sur GitHub Releases..."
            
            # Nettoyage de l'ancienne release "latest"
            gh release delete latest --yes || true
            git tag -d latest || true
            git push origin :refs/tags/latest || true

            # Création de la release avec le fichier APK attaché
            gh release create latest "$APK_FILE" \
              --title "Dernière version APK" \
              --notes "Compilation automatique effectuée avec succès." \
              --prerelease
              
            echo "=========================================================="
            echo " ✔ APK publié ! Téléchargeable dans la rubrique Releases de ton dépôt."
            echo "=========================================================="
          else
            echo "❌ Aucun fichier APK n'a été trouvé."
            exit 1
          fi
