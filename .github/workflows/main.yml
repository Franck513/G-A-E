name: Build G-A-E APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev clang cmake ninja-build pkg-config libstdc++-12-dev mesa-utils

      - name: Configurer Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: Acceptation des licences Android SDK
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Installation de Flet CLI (Version stable)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "flet==0.24.1"

      - name: Générer l'APK Android
        env:
          CI: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          PUB_DISABLE_ANALYTICS: "true"
        run: |
          yes | flet build apk --verbose

      - name: Publier l'APK sur GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find build/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Publication de l'APK sur GitHub Releases..."
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest "$APK_FILE" \
              --title "Dernière version APK" \
              --notes "Compilation automatique effectuée avec succès." \
              --prerelease
            echo "APK publié avec succès !"
          else
            echo "Erreur : Aucun fichier APK trouvé."
            exit 1
          fi
